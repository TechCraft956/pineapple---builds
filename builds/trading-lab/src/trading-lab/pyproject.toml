[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-lab"
version = "0.1.0"
description = "Research, backtesting, risk and ML lab for discretionary futures rules"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["lse-data[frames]>=0.14"]
viz = ["matplotlib>=3.8", "jupyter>=1.0"]
boost = ["xgboost>=2.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::FutureWarning"]

<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pineapple OS</title>
<style>
:root{--bg:#0b1030;--panel:#141a45;--card:#1b2358;--card2:#202a64;--line:#2a3576;
 --ink:#eef1fb;--mute:#97a3d4;--gold:#e0b341;--gold2:#f2c659;--ice:#bcd0ff;--green:#54c98f;
 --red:#ec7a68;--blue:#6aa6ff;--shadow:0 10px 30px rgba(4,8,30,.55)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 80% -10%,#1a2566 0,transparent 60%),var(--bg);
 color:var(--ink);font-family:"Segoe UI",system-ui,Arial,sans-serif}
a{color:var(--blue);text-decoration:none}
#app{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden}
aside{background:linear-gradient(180deg,#10163f,#0c1130);border-right:1px solid var(--line);
 display:flex;flex-direction:column;padding:16px 12px;overflow:auto;z-index:40}
#backdrop{display:none;position:fixed;inset:0;background:rgba(4,8,30,.6);backdrop-filter:blur(2px);z-index:35}
#hamb{display:none}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand .logo{font-size:24px}.brand b{font-size:17px;letter-spacing:.5px}
.brand small{display:block;color:var(--mute);font-size:11px;letter-spacing:2px}
nav{display:flex;flex-direction:column;gap:3px}
.navi{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--mute);
 cursor:pointer;font-size:13.5px;transition:.16s;user-select:none}
.navi:hover{background:#192154;color:var(--ink)}
.navi.active{background:linear-gradient(90deg,#23306f,#1b2358);color:var(--gold);box-shadow:var(--shadow)}
.navi .ic{width:18px;text-align:center;font-size:14px}
aside .foot{margin-top:auto;padding:12px 10px;color:var(--mute);font-size:12px;border-top:1px solid var(--line)}
aside .foot b{color:var(--ice)}
main{overflow:auto}
.topbar{position:sticky;top:0;z-index:5;backdrop-filter:blur(8px);background:rgba(12,17,48,.82);
 border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:15px 24px}
.topbar h1{font-size:18px;font-weight:600}.topbar .sub{color:var(--mute);font-size:12px;margin-top:2px}
.spacer{flex:1}
.icobtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:9px;
 padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.icobtn:hover{background:var(--gold);color:#16183a;border-color:var(--gold)}.icobtn.ghost{background:transparent}
.wrap{padding:20px 24px;max-width:1180px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
 border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--gold);margin-bottom:11px}
.stat .n{font-size:38px;font-weight:700;line-height:1;font-family:Cambria,Georgia,serif}
.stat .l{color:var(--mute);font-size:13px;margin-top:6px}
.kpi{transition:.18s;position:relative;overflow:hidden}.kpi:hover{transform:translateY(-3px);border-color:var(--gold)}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold2),transparent)}
.kpi .ico{position:absolute;top:13px;right:15px;font-size:19px;opacity:.45}
.kpi .n{background:linear-gradient(180deg,#fff,var(--ice));-webkit-background-clip:text;background-clip:text;color:transparent}
.rank{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:50%;
 background:#0e1440;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ice)}
.score{display:inline-flex;align-items:center;gap:6px;font-family:Cambria,Georgia,serif;font-weight:700;font-size:15px;
 padding:3px 11px;border-radius:20px;border:1px solid transparent}
.score.hi{color:#9fe7c2;background:rgba(84,201,143,.13);border-color:rgba(84,201,143,.42)}
.score.mid{color:var(--gold2);background:rgba(224,179,65,.12);border-color:rgba(224,179,65,.4)}
.score.lo{color:var(--mute);background:#1a2358;border-color:var(--line)}
.score .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.cat.MONEY{background:rgba(84,201,143,.16);color:#9fe7c2}
.cat.RISKS{background:rgba(236,122,104,.16);color:#f3b0a4}
.cat.ASSETS{background:rgba(106,166,255,.16);color:#bcd4ff}
.cat.OPPORTUNITIES{background:rgba(224,179,65,.16);color:#f2d489}
.cat.HEALTH{background:rgba(180,120,255,.16);color:#dcc4ff}
tr.brow td{padding:11px 10px}
.status{display:flex;align-items:center;gap:8px;background:rgba(84,201,143,.1);border:1px solid rgba(84,201,143,.32);
 color:#9fe7c2;border-radius:20px;padding:6px 13px;font-size:12px;font-weight:600;white-space:nowrap}
.status .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(84,201,143,.5)}70%{box-shadow:0 0 0 7px rgba(84,201,143,0)}100%{box-shadow:0 0 0 0 rgba(84,201,143,0)}}
@media(max-width:680px){.status .stxt{display:none}}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid #1d2657}tr:hover td{background:#1a2358}
.q{font-family:Cambria,Georgia,serif;font-weight:700;color:var(--gold)}
.cat{font-size:11px;padding:2px 8px;border-radius:9px;background:#22306f;color:var(--ice)}
.flag{color:var(--red);font-size:11px;font-weight:700;margin-left:6px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin:6px 0 2px}
.btn{background:linear-gradient(180deg,#26318a,#202a64);border:1px solid var(--line);color:var(--ink);
 border-radius:10px;padding:10px 15px;font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
.btn:hover{transform:translateY(-2px);border-color:var(--gold);color:var(--gold2)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1633;border-color:var(--gold)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:wait;transform:none}
.feed{display:grid;gap:11px}
.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;transition:.15s}
.item:hover{border-color:var(--gold);transform:translateX(3px);background:var(--card2)}
.item .t{color:var(--ink);font-weight:600;font-size:14px;line-height:1.35}
.item .m{display:flex;align-items:center;gap:9px;margin-top:7px;color:var(--mute);font-size:12px;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 9px;border-radius:10px;background:#22306f;color:var(--ice)}
.chip.src{background:#2c2350;color:#e7d4ff}.chip.on{background:#16563b;color:#bdf0d6}
.chip.off{background:#3a3050;color:#c4b4dc}.chip.meta{background:#4a3a12;color:#f5d98c}
.chip.full{background:#16395a;color:#bcd9ff}.up{color:var(--green)}.down{color:var(--red)}
.field{margin-bottom:13px}.field label{display:block;color:var(--mute);font-size:12px;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:#0e1440;border:1px solid var(--line);
 color:var(--ink);border-radius:9px;padding:10px 12px;font-size:13.5px;font-family:inherit}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.toggle{display:flex;align-items:center;gap:8px;background:#0e1440;border:1px solid var(--line);
 padding:8px 12px;border-radius:9px;cursor:pointer;font-size:13px}.toggle input{accent-color:var(--gold)}
.help h4{color:var(--gold);margin:15px 0 6px;font-size:14px}
.help p,.help li{color:#cfd6f5;font-size:14px;line-height:1.6}
.help code{background:#0e1440;padding:2px 7px;border-radius:6px;color:var(--gold2);font-family:Consolas,monospace}
.help ul{margin-left:20px}
.view{display:none;animation:fade .25s ease}.view.show{display:block}
.navi{position:relative}.dot-badge{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--gold,#e8b04b);box-shadow:0 0 6px rgba(232,176,75,.8);animation:fade .3s ease}
.nav-adv{margin-top:8px;border-top:1px solid var(--line);padding-top:10px;font-weight:600;color:var(--mute)}
.nav-adv .adv-caret{margin-left:auto;transition:transform .2s}.nav-adv.open .adv-caret{transform:rotate(180deg)}
.nav-advanced{animation:fade .2s ease}.nav-advanced .navi{padding-left:20px;font-size:13px;opacity:.92}
.mission-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.close-menu{display:flex;gap:5px;flex-wrap:wrap}.close-menu .btn{font-size:11px;padding:4px 8px}
.freshpill{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--mute);align-self:center;white-space:nowrap}
.freshpill.upd{color:#9fe7c2;border-color:rgba(84,201,143,.4);background:rgba(84,201,143,.08)}
.freshpill.stale{color:#f3b0a4;border-color:rgba(236,122,104,.4);background:rgba(236,122,104,.08)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:30}
.tt{background:#192155;border:1px solid var(--line);border-left:4px solid var(--gold);padding:11px 15px;
 border-radius:10px;box-shadow:var(--shadow);font-size:13px;min-width:230px;animation:fade .2s}
.tt.ok{border-left-color:var(--green)}.tt.err{border-left-color:var(--red)}
.muted{color:var(--mute)}
.loading{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);
 border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
video,canvas.cam{width:100%;max-width:520px;border-radius:12px;border:1px solid var(--line);background:#04081f}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:96px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#222c66;border-radius:6px}
.searchbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.searchbar input,.searchbar select{background:#0e1440;border:1px solid var(--line);color:var(--ink);
 border-radius:9px;padding:9px 12px;font-size:13.5px}
.searchbar input{flex:1;min-width:200px}
.card table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:860px){
 #app{grid-template-columns:1fr}
 aside{position:fixed;top:0;left:0;height:100vh;width:268px;transform:translateX(-110%);
  transition:transform .26s cubic-bezier(.4,0,.2,1)}
 aside.open{transform:none;box-shadow:0 0 50px rgba(0,0,0,.6)}
 aside.open ~ #backdrop, #backdrop.show{display:block}
 #hamb{display:inline-flex}
 .wrap{padding:16px 14px}
 .g4,.g3,.g2,.row3,.row2{grid-template-columns:1fr}
 .stat .n{font-size:32px}
 .topbar{padding:12px 14px}.topbar h1{font-size:16px}
 .icobtn{padding:7px 10px;font-size:12px}
}
@media(max-width:480px){.icobtn .lbl{display:none}.topbar{gap:8px}}
/* ---- finish pass (iter 3): a11y + premium ---- */
::selection{background:rgba(224,179,65,.32);color:#fff}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px;border-radius:8px}
.brand .logo{filter:drop-shadow(0 0 10px rgba(224,179,65,.5))}
.btn.gold{position:relative;overflow:hidden}
.btn.gold::after{content:"";position:absolute;top:0;left:-60%;width:38%;height:100%;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-18deg);
 animation:sheen 5s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,74%{left:-60%}88%{left:135%}100%{left:135%}}
.role{font-weight:700;letter-spacing:.3px}
.role.OWNER{color:var(--gold2)}.role.ADMIN{color:#bcd4ff}
.role.FAMILY_USER{color:#9fe7c2}.role.TRADER_USER{color:#dcc4ff}.role.PAID_USER{color:#f2d489}
.an-grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){.an-grid{grid-template-columns:1fr}}
svg.chart{display:block;width:100%;height:auto;max-height:266px;overflow:visible;margin:0 auto}
.chart-cap{color:var(--mute);font-size:11px;margin-top:10px;text-align:center;line-height:1.5}
.legend{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin-top:12px;font-size:12px;color:#cfd6f5}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.an-metric .n{font-size:30px}
#palette{display:none;position:fixed;inset:0;background:rgba(4,8,30,.55);backdrop-filter:blur(3px);z-index:60;align-items:flex-start;justify-content:center}
#palette.show{display:flex}
.pal-box{margin-top:11vh;width:560px;max-width:92vw;background:linear-gradient(180deg,#1a2358,#141a45);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
#palinput{width:100%;background:#0e1440;border:none;border-bottom:1px solid var(--line);color:var(--ink);padding:15px 18px;font-size:15px;outline:none;font-family:inherit}
#pallist{max-height:46vh;overflow:auto}
.pal-item{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;font-size:14px;color:var(--mute)}
.pal-item .pi{width:18px;text-align:center;color:var(--gold)}
.pal-item.sel,.pal-item:hover{background:#23306f;color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important}}
</style></head>
<body>
<div id="app">
  <aside id="aside">
    <div class="brand"><span class="logo">&#127821;</span><div><b>PINEAPPLE</b><small>OS &middot; v2</small></div></div>
    <nav id="nav"></nav>
    <div class="foot">Operator: <b id="opname">—</b><br><span class="muted">Local-first &middot; 127.0.0.1</span></div>
  </aside>
  <div id="backdrop" onclick="drawer(false)"></div>
  <main>
    <div class="topbar">
      <button class="icobtn ghost" id="hamb" onclick="drawer(true)" title="Menu" aria-label="Open menu">&#9776;</button>
      <div><h1 id="ptitle">Today — Morning Brief</h1><div class="sub" id="psub">What changed, what matters, next moves</div></div>

</div>

<div id="palette"><div class="pal-box"><input id="palinput" placeholder="Jump to a view, or type a command…" oninput="PAL.filter(this.value)"><div id="pallist"></div></div></div>
<script>
const Snd=(()=>{let ctx,on=true;
 function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx}
 function tone(f,t,type,g){if(!on)return;const c=ac();const o=c.createOscillator(),a=c.createGain();
  o.type=type||"sine";o.frequency.value=f;a.gain.value=0;o.connect(a);a.connect(c.destination);
  const n=c.currentTime;a.gain.linearRampToValueAtTime(g||.05,n+.01);
  a.gain.exponentialRampToValueAtTime(.0001,n+(t||.12));o.start(n);o.stop(n+(t||.12))}
 return{set(v){on=v},get(){return on},click(){tone(420,.05,"triangle",.04)},
  nav(){tone(540,.07,"sine",.045)},ok(){tone(660,.09,"sine",.05);setTimeout(()=>tone(880,.12,"sine",.05),80)},
  err(){tone(200,.18,"sawtooth",.05)},shutter(){tone(900,.04,"square",.05);setTimeout(()=>tone(500,.06,"square",.04),60)}}})();

let STATE={},SOURCES={};
const NAV=[["today","Today","☀"],["missions","Missions","◎"],["pipeline","Case Pipeline","⛓"],["scheduler","Scheduler","⏱"],["dash","Dashboard","◉"],["command","Command","⌖"],["graph","Graph","⊛"],["agency","Agency","★"],["observatory","Observatory","❖"],["evolution","Evolution","✦"],["analytics","Analytics","◫"],["radar","Real Estate","⌂"],["recon","Recon","⊙"],["map","Map","◍"],
 ["simulate","Simulator","∿"],["crm","CRM","☰"],["assets","Assets","◆"],["bank","Family Bank","⛂"],
 ["intel","Live Intel","⌖"],["markets","Markets","▲"],
 ["news","News","▤"],["library","Library","▦"],["sources","Sources","⛁"],
 ["phone","Phone","☎"],["camera","Camera","◉"],["network","Network","⛭"],["god","God Mode","♛"],["learning","Learning","↻"],
 ["operator","Operator","◈"],["council","Council","♜"],["labs","Labs","⚗"],["security","Security","⛨"],["inbox","Universal Inbox","⮈"],["backtest","Backtest Desk","∿"],["reports","Reports","▦"],["search","Search","⌕"],["health","System Health","✚"],["departments","Departments","▦"],["workflow","Workflow Repair","⚒"],["alerts","Alerts","◔"],["connectors","Connectors","⧉"],
 ["evidence","Evidence","⚖"],["chains","Task Chains","⛓"],["updates","Updates","✸"],["loop","Closed Loop","♺"],["memory","Telemetry","❖"],["timeline","Timeline","⟿"],["certify","Certify","◎"],["remote","Remote","⇄"],["qa","QA","✓"],
 ["settings","Settings","⚙"],["help","Help","?"]];
const TITLES={today:["Today — Morning Brief","What changed overnight, what matters, money opportunities, risks, and the next 5 safe actions — from the operating database"],
 pipeline:["Case Pipeline","Every important item is a case moving through stages: NEW → VERIFIED → SCORED → ACTION → APPROVAL → OUTCOME → LEARNED"],
 scheduler:["Scheduler / Overnight Operator","Safe jobs that run unattended via Windows Task Scheduler — run now, or install the overnight schedule (owner-gated)"],
 missions:["Operator Missions","Your operator employee — what changed, what matters, what made money possible, what I prepared, what needs you"],

function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function esc(s){return (s==null?"":""+s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function kb(n){n=+n||0;return n>1048576?(n/1048576).toFixed(1)+" MB":n>1024?(n/1024).toFixed(0)+" KB":n+" B"}

function drawer(open){const a=document.getElementById("aside"),b=document.getElementById("backdrop");
 if(window.innerWidth>860){a.classList.remove("open");b.classList.remove("show");return}
 a.classList.toggle("open",open);b.classList.toggle("show",open)}
const PRIMARY_NAV=["today","missions","inbox","pipeline","reports","search","health","settings"];
function navItem(n,id,label,ic){const d=el("div","navi"+(id=="today"?" active":""),
  `<span class="ic">${ic}</span><span>${label}</span>`);d.onclick=()=>{Snd.nav();show(id);drawer(false)};
  d.id="nav-"+id;d.tabIndex=0;d.setAttribute("role","button");d.setAttribute("aria-label",label);
  d.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();Snd.nav();show(id);drawer(false)}};n.appendChild(d)}
function buildNav(){const n=document.getElementById("nav");n.innerHTML="";
 const map={};NAV.forEach(([id,label,ic])=>map[id]=[id,label,ic]);
 // mission-first: primary tools up top
 PRIMARY_NAV.forEach(id=>{if(map[id])navItem(n,...map[id])});
 // everything else folds under a collapsible Advanced drawer (no data loss; palette still reaches all)
 const adv=el("div","navi nav-adv",`<span class="ic">⚙</span><span>Admin / Advanced</span><span class="adv-caret">▾</span>`);
 adv.id="nav-adv-toggle";adv.tabIndex=0;adv.setAttribute("role","button");
 const grp=el("div","nav-advanced");grp.id="nav-advanced";grp.style.display="none";
 adv.onclick=()=>{const open=grp.style.display=="none";grp.style.display=open?"block":"none";adv.classList.toggle("open",open);Snd.nav()};
 adv.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();adv.click()}};
 n.appendChild(adv);n.appendChild(grp);
 NAV.forEach(([id,label,ic])=>{if(!PRIMARY_NAV.includes(id))navItem(grp,id,label,ic)})}
function show(id){document.querySelectorAll(".navi").forEach(x=>x.classList.remove("active"));
 const ni=document.getElementById("nav-"+id);if(ni)ni.classList.add("active");
 // if navigating to an Advanced page (e.g. via palette), reveal the drawer so the active item shows
 const grp=document.getElementById("nav-advanced");
 if(grp&&!PRIMARY_NAV.includes(id)){grp.style.display="block";const tog=document.getElementById("nav-adv-toggle");if(tog)tog.classList.add("open")}
 document.querySelectorAll(".view").forEach(v=>v.classList.remove("show"));
 document.getElementById("v-"+id).classList.add("show");
 document.getElementById("ptitle").textContent=TITLES[id][0];
 document.getElementById("psub").textContent=TITLES[id][1];clearBadge(id);render(id)}

async function pollBadges(){try{const d=await jget("/api/page-badges");BADGES=d.pending||{};
  document.querySelectorAll(".navi .dot-badge").forEach(e=>e.remove());
  Object.keys(BADGES).forEach(p=>{const id=PAGE_TO_NAV[p],n=id&&document.getElementById("nav-"+id);
   if(n&&!n.querySelector(".dot-badge"))n.appendChild(el("span","dot-badge"));});
  freshPill(currentView());}catch(e){}}

function freshPill(id){const pill=document.getElementById("freshpill");if(!pill)return;
  const pg=Object.keys(PAGE_TO_NAV).find(k=>PAGE_TO_NAV[k]===id),b=pg&&BADGES[pg];
  if(b){pill.style.display="";pill.className="freshpill "+(b.status=="refresh_required"?"stale":"upd");
   pill.textContent=(b.status=="refresh_required"?"Refresh required":"Updated · "+b.pending+" new");}
  else{pill.style.display="none";}}
async function clearBadge(id){const pg=Object.keys(PAGE_TO_NAV).find(k=>PAGE_TO_NAV[k]===id);
  if(pg){const n=document.getElementById("nav-"+id),b=n&&n.querySelector(".dot-badge");if(b)b.remove();
   delete BADGES[pg];freshPill(id);try{await jpost("/api/page-badge/clear",{page:pg})}catch(e){}}}
function toast(msg,kind){const t=el("div","tt "+(kind||""),esc(msg));document.getElementById("toast").appendChild(t);

async function jget(u){const r=await fetch(u);return r.json()}

 document.getElementById("opname").textContent=set.operator_name||"Operator";
 Snd.set(set.sound!==false);syncSoundBtn();updateStatus();

 const red=/RED|CONTRACT|RISK-?OFF/i.test(txt);
 pill.style.background=red?"rgba(236,122,104,.1)":"rgba(84,201,143,.1)";
 pill.style.borderColor=red?"rgba(236,122,104,.34)":"rgba(84,201,143,.32)";

 (m.missions||[]).forEach(c=>{const st=c.status||'',green=st.startsWith('GREEN');

function svgDonut(segs,size){size=size||190;const r=size/2-7,cx=size/2,cy=size/2,C=2*Math.PI*r;
 const tot=segs.reduce((a,s)=>a+s.value,0)||1;let off=0;
 const parts=segs.filter(s=>s.value>0).map(s=>{const len=s.value/tot*C;

   transform="rotate(-90 ${cx} ${cy})"><title>${esc(s.label)}: ${s.value}</title></circle>`;off+=len;return e}).join("");
 return `<svg class="chart" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1b2358" stroke-width="13"/>${parts}
  <text x="${cx}" y="${cy-3}" text-anchor="middle" fill="#eef1fb" font-size="25" font-weight="700" font-family="Cambria,Georgia,serif">${tot}</text>
  <text x="${cx}" y="${cy+15}" text-anchor="middle" fill="#97a3d4" font-size="11">items</text></svg>`}
function svgRadar(axes,size){size=size||236;const cx=size/2,cy=size/2,R=size/2-40,n=axes.length;
 const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+R*(v/100)*Math.cos(a),cy+R*(v/100)*Math.sin(a)]};
 let rings="";[.25,.5,.75,1].forEach(k=>{const p=axes.map((_,i)=>{const[x,y]=pt(i,k*100);return `${x.toFixed(1)},${y.toFixed(1)}`}).join(" ");
  rings+=`<polygon points="${p}" fill="none" stroke="#2a3576" stroke-width="1"/>`});
 const spokes=axes.map((_,i)=>{const[x,y]=pt(i,100);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#2a3576"/>`}).join("");
 const poly=axes.map((ax,i)=>{const[x,y]=pt(i,Math.max(3,ax.value));return `${x.toFixed(1)},${y.toFixed(1)}`}).join(" ");
 const dots=axes.map((ax,i)=>{const[x,y]=pt(i,Math.max(3,ax.value));return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="#f2c659"/>`}).join("");

 return `<svg class="chart" viewBox="0 0 ${size} ${size}">${rings}${spokes}<polygon points="${poly}" fill="rgba(224,179,65,.18)" stroke="#e0b341" stroke-width="2"/>${dots}${labs}</svg>`}

  return `<g><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-8).toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="4" fill="${b.color}"><title>${esc(b.label)}: ${b.value}</title></rect>

function svgHBars(rows,w){w=w||300;const rh=32,h=rows.length*rh+8,max=Math.max(1,...rows.map(r=>r.value));
 const bars=rows.map((r,i)=>{const bw=r.value/max*(w-130),y=8+i*rh;
  return `<g><text x="0" y="${y+15}" fill="#bcd0ff" font-size="12">${esc(r.label)}</text>
   <rect x="70" y="${y+4}" width="${w-130}" height="14" rx="7" fill="#16204e"/>
   <rect x="70" y="${y+4}" width="${Math.max(3,bw).toFixed(1)}" height="14" rx="7" fill="${r.color}"/>
   <text x="${w-20}" y="${y+15}" text-anchor="end" fill="#eef1fb" font-size="12" font-weight="700">${r.value}</text></g>`}).join("");
 return `<svg class="chart" viewBox="0 0 ${w} ${h}">${bars}</svg>`}
function svgSpark(points,w,h){w=w||330;h=h||96;points=(points||[]).map(x=>+x||0);if(!points.length)return `<div class="card" style="background:#101842"><p class="muted">No chart data yet — empty state, not fake data.</p></div>`;
 const min=Math.min(...points),max=Math.max(...points),span=max-min||1,pad=12;
 const xy=points.map((v,i)=>{const x=pad+i*((w-pad*2)/Math.max(1,points.length-1)),y=h-pad-((v-min)/span)*(h-pad*2);return [x,y]});
 const line=xy.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
 const dots=xy.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${points[i]>=0?'#54c98f':'#ec7a68'}"/>`).join('');

function drawGraph(g){const W=1000,H=640,cx=W/2,cy=H/2;
 const byType={};g.nodes.forEach(n=>{(byType[n.type]=byType[n.type]||[]).push(n)});

 const typeAngle={};const types=Object.keys(byType).filter(t=>t!='owner');
 types.forEach((t,i)=>typeAngle[t]=(i/types.length)*Math.PI*2);
 GRAPH.pos={};
 g.nodes.forEach(n=>{
   if(n.type=='owner'){GRAPH.pos[n.id]={x:cx,y:cy};return}
   const arr=byType[n.type],idx=arr.indexOf(n),m=arr.length;
   const spread=Math.min(Math.PI*1.7,0.35+m*0.18);
   const base=typeAngle[n.type], a=base+(m>1?(idx/(m-1)-0.5)*spread:0);
   const r=(ringR[n.type]||260)+((idx%2)*26);
   GRAPH.pos[n.id]={x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r}});

 // edges
 g.edges.forEach(e=>{const a=GRAPH.pos[e.from],b=GRAPH.pos[e.to];if(!a||!b)return;
   svg+=`<line x1="${a.x.toFixed(0)}" y1="${a.y.toFixed(0)}" x2="${b.x.toFixed(0)}" y2="${b.y.toFixed(0)}" stroke="#27306099" stroke-width="1"/>`});
 // nodes
 g.nodes.forEach(n=>{const p=GRAPH.pos[n.id];if(!p)return;const rad=n.type=='owner'?16:Math.max(4,Math.min(12,4+n.degree*1.3));
   svg+=`<g class="gnode" style="cursor:pointer" onclick="graphNode('${n.id.replace(/'/g,"")}')">
     <circle cx="${p.x.toFixed(0)}" cy="${p.y.toFixed(0)}" r="${rad}" fill="${col(n.type)}" stroke="#0a0f24" stroke-width="1.5"><title>${esc(n.type)}: ${esc(n.label)} (deg ${n.degree})</title></circle>`;
   if(n.type=='owner'||n.degree>=3)svg+=`<text x="${p.x.toFixed(0)}" y="${(p.y-rad-3).toFixed(0)}" fill="#cfe0ff" font-size="${n.type=='owner'?13:10}" text-anchor="middle">${esc(n.label.slice(0,18))}</text>`;
   svg+=`</g>`});
 svg+=`</svg>`;
 document.getElementById("gsvg").innerHTML=svg}

const PAL=(()=>{let sel=0,items=[];
 const ACTIONS=[...NAV.map(([id,label])=>({t:"Go: "+label,ic:"→",run:()=>show(id)})),
  {t:"Run Decision Brief",ic:"▶",run:()=>{show('dash');setTimeout(()=>runAction('brief','Running brief'),60)}},
  {t:"Run QA Harness",ic:"✓",run:()=>{show('qa');setTimeout(runQA,80)}},
  {t:"Security scan",ic:"⛨",run:()=>show('security')},
  {t:"Answer Evolution questions",ic:"✦",run:()=>show('evolution')},
  {t:"Refresh all data",ic:"↻",run:()=>loadState(true)},
  {t:"Open outputs folder",ic:"📁",run:()=>openOutputs()}];
 const box=()=>document.getElementById("palette");
 function open(){box().classList.add("show");const i=document.getElementById("palinput");i.value="";filter("");i.focus()}
 function close(){box().classList.remove("show")}
 function filter(q){q=(q||"").toLowerCase();items=ACTIONS.filter(a=>a.t.toLowerCase().includes(q));sel=0;draw()}
 function draw(){const l=document.getElementById("pallist");l.innerHTML=items.length?items.map((a,i)=>`<div class="pal-item ${i==sel?'sel':''}" data-i="${i}"><span class="pi">${a.ic}</span><span>${esc(a.t)}</span></div>`).join(""):`<div class="pal-item">no match</div>`;
  [...l.querySelectorAll(".pal-item[data-i]")].forEach(el=>{el.onclick=()=>{sel=+el.dataset.i;choose()}})}
 function choose(){const a=items[sel];if(a){close();Snd.nav();a.run()}}
 function key(e){if(e.key=="ArrowDown"){sel=Math.min(items.length-1,sel+1);draw();e.preventDefault()}
  else if(e.key=="ArrowUp"){sel=Math.max(0,sel-1);draw();e.preventDefault()}
  else if(e.key=="Enter"){choose()}else if(e.key=="Escape"){close()}}
 return{open,close,filter,key,isOpen:()=>box().classList.contains("show")}})();
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&(e.key=="k"||e.key=="K")){e.preventDefault();PAL.isOpen()?PAL.close():PAL.open();return}if(PAL.isOpen())PAL.key(e)});
buildNav();loadState(false);pollBadges();setInterval(pollBadges,15000);
